</header><main class="section"><div class="wrap"><div class="eyebrow">ORDER TRACKING</div><h1 class="title">ติดตามคำสั่งซื้อ</h1><p class="desc">กรอกเลขออเดอร์ เช่น MX12345678 เพื่อตรวจสอบสถานะได้ทันที</p><form id="trackForm" class="formbox"><label>เลขที่คำสั่งซื้อ<input id="trackNo" required placeholder="MX12345678"></label><button class="btn">ตรวจสอบสถานะ</button></form><div id="trackResult" style="margin-top:20px"></div><script>(function(){const qNo=new URLSearchParams(location.search).get('no');if(qNo)document.getElementById('trackNo').value=qNo})();document.getElementById('trackForm').onsubmit=e=>{e.preventDefault();let n=document.getElementById('trackNo').value.trim().toUpperCase();let os=JSON.parse(localStorage.getItem('motox_orders')||'[]'),o=os.find(x=>x.order_no===n),el=document.getElementById('trackResult');if(!o){el.innerHTML='<div class="empty">ไม่พบเลขคำสั่งซื้อนี้ กรุณาตรวจสอบอีกครั้ง</div>';return}el.innerHTML='<div class="notice"><h2>ออเดอร์ '+o.order_no+'</h2><p>วันที่: '+o.created_at+'</p><h3>สถานะ: '+(o.status||'รอดำเนินการ')+'</h3><p>ยอดรวม: <b>฿'+new Intl.NumberFormat('th-TH').format(o.total||0)+'</b></p><p>รายการ: '+(o.items||[]).map(i=>i.name+' × '+i.qty).join(', ')+'</p></div>'}</script></div></main><footer class="footer"><div class="wrap"><p>© 2026 MOTO-X PARTS — เว็บไซต์ตัวอย่างสำหรับงานโปรเจกต์</p></div></footer><script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
